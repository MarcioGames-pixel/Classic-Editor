name: Build ClassicEditor

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: windows-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '8'

  - name: Build
    shell: pwsh
    run: |
      New-Item -ItemType Directory -Force build | Out-Null
      New-Item -ItemType Directory -Force dist | Out-Null

      javac -encoding UTF-8 -cp "c0.30-1.jar" -d build `
        src/ClassicEditor.java `
        src/ClassicEditorGUI.java `
        src/LevelIO.java `
        src/LevelConverter.java `
        src/NBTReader.java `
        src/SerializationReader.java

      jar cfe dist/ClassicEditor.jar ClassicEditor -C build .

  - name: Convert logo to ICO
    shell: pwsh
    run: |
      python -m pip install Pillow
      python -c "from PIL import Image; Image.open('logo.png').convert('RGBA').save('ClassicEditor.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

  - name: Build EXE
    shell: pwsh
    run: |
      jpackage `
        --type app-image `
        --name ClassicEditor `
        --input dist `
        --main-jar ClassicEditor.jar `
        --main-class ClassicEditor `
        --icon ClassicEditor.ico `
        --dest dist

      Compress-Archive `
        -Path "dist/ClassicEditor" `
        -DestinationPath "dist/ClassicEditor-Windows.zip"

  - name: Upload artifacts
    uses: actions/upload-artifact@v4
    with:
      name: ClassicEditor-Windows
      path: |
        dist/ClassicEditor.jar
        dist/ClassicEditor-Windows.zip
        ClassicEditor.ico
