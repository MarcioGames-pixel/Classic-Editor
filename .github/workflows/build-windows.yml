name: Build ClassicEditor Windows

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build ClassicEditor.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: none

      - name: Show Java version
        shell: powershell
        run: |
          java -version
          javac -version
          jpackage --version

      - name: Create build directory
        shell: powershell
        run: |
          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }

          New-Item -ItemType Directory -Path build | Out-Null

      - name: Compile ClassicEditor
        shell: powershell
        run: |
          javac `
            -cp "c0.30-1.jar" `
            -d build `
            src/ClassicEditor.java `
            src/ClassicEditorGUI.java `
            src/LevelIO.java `
            src/LevelConverter.java `
            src/NBTReader.java `
            src/SerializationReader.java

      - name: Create ClassicEditor.jar
        shell: powershell
        run: |
          @"
          Manifest-Version: 1.0
          Main-Class: ClassicEditorGUI
          Class-Path: c0.30-1.jar
          "@ | Set-Content -Encoding ASCII MANIFEST.MF

          if (Test-Path ClassicEditor.jar) {
            Remove-Item ClassicEditor.jar -Force
          }

          jar cfm ClassicEditor.jar MANIFEST.MF -C build .

      - name: Test ClassicEditor.jar
        shell: powershell
        run: |
          jar tf ClassicEditor.jar | Select-Object -First 20

      - name: Convert logo.png to logo.ico
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

          python -c "from PIL import Image; im=Image.open('logo.png').convert('RGBA'); im.save('logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

          if (!(Test-Path logo.ico)) {
            Write-Error "logo.ico was not created."
            exit 1
          }

          Write-Host "logo.ico created successfully."

      - name: Prepare jpackage input
        shell: powershell
        run: |
          if (Test-Path package) {
            Remove-Item package -Recurse -Force
          }

          New-Item -ItemType Directory -Path package\input | Out-Null

          Copy-Item ClassicEditor.jar package\input\
          Copy-Item c0.30-1.jar package\input\

      - name: Build Windows application
        shell: powershell
        run: |
          if (Test-Path output) {
            Remove-Item output -Recurse -Force
          }

          New-Item -ItemType Directory -Path output | Out-Null

          jpackage `
            --type app-image `
            --name ClassicEditor `
            --input package\input `
            --main-jar ClassicEditor.jar `
            --main-class ClassicEditorGUI `
            --icon logo.ico `
            --dest output `
            --app-version 0.0.1.1 `
            --vendor "MarcioGames-pixel" `
            --description "Save editor for Minecraft Classic and older Java versions."

      - name: Create Windows installer
        shell: powershell
        run: |
          if (Test-Path installer) {
            Remove-Item installer -Recurse -Force
          }

          New-Item -ItemType Directory -Path installer | Out-Null

          jpackage `
            --type exe `
            --name ClassicEditor `
            --input package\input `
            --main-jar ClassicEditor.jar `
            --main-class ClassicEditorGUI `
            --icon logo.ico `
            --dest installer `
            --app-version 0.0.1.1 `
            --vendor "MarcioGames-pixel" `
            --description "Save editor for Minecraft Classic and older Java versions." `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser

      - name: Prepare release files
        shell: powershell
        run: |
          if (Test-Path artifacts) {
            Remove-Item artifacts -Recurse -Force
          }

          New-Item -ItemType Directory -Path artifacts | Out-Null

          Copy-Item ClassicEditor.jar artifacts\
          Copy-Item c0.30-1.jar artifacts\
          Copy-Item logo.png artifacts\
          Copy-Item logo.ico artifacts\
          Copy-Item installer\*.exe artifacts\

          Compress-Archive `
            -Path output\ClassicEditor\* `
            -DestinationPath artifacts\ClassicEditor-Windows.zip `
            -Force

      - name: Upload ClassicEditor.jar
        uses: actions/upload-artifact@v4
        with:
          name: ClassicEditor-JAR
          path: artifacts/ClassicEditor.jar
          if-no-files-found: error

      - name: Upload ClassicEditor.exe
        uses: actions/upload-artifact@v4
        with:
          name: ClassicEditor-Windows-Installer
          path: artifacts/*.exe
          if-no-files-found: error

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ClassicEditor-Windows
          path: artifacts/ClassicEditor-Windows.zip
          if-no-files-found: error

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: ClassicEditor-Complete
          path: |
            artifacts/ClassicEditor.jar
            artifacts/c0.30-1.jar
            artifacts/logo.png
            artifacts/logo.ico
            artifacts/*.exe
          if-no-files-found: error
